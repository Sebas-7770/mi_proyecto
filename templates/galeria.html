{% extends "base.html" %}
{% block contenido %}

<h1 style="text-align: center; margin-top: 30px;">📷 Mis Imágenes</h1>
<p style="text-align: center; margin-bottom: 40px;">Aquí puedes ver mis fotos:</p>

<style>
/* Contenedor: organiza las fotos en filas */
.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
}

/* Cada cuadro de foto: mismo tamaño para todas */
.cuadro-foto {
    width: 100%;
    height: 280px; /* Altura igual para todas */
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
}

/* La imagen: se ajusta sin deformarse */
.cuadro-foto img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Recorta y centra → todas iguales */
    transition: transform 0.3s ease;
}

/* Efecto al pasar el mouse */
.cuadro-foto img:hover {
    transform: scale(1.05);
}
</style>

<div class="galeria">

<!-- Primera foto -->
 <div class="cuadro-foto">
<img src="{{ url_for('static', filename='mi_foto.jpg') }}" alt="Mi foto" class="imagen">
